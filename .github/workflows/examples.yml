# Build each example in examples/ against the packages this commit builds,
# installed from their packed tarballs as an app installs them, and open it in
# headless Chrome (scripts/examples.mjs): an example a job, so that one
# framework's failure doesn't hide another's, and a new example needs no
# change here.
#
# On a change to what they test: the browser packages, the examples, the
# script, or the lockfile. And nightly, since the examples install each
# framework's latest release in their range, and one can break them with no
# change here; and by hand.
name: Examples

on:
    push:
        branches: [main]
        paths: &tested
            - "packages/udoc-ui/**"
            - "packages/udoc-viewer/**"
            - "packages/udoc-editor/**"
            - "examples/**"
            - "scripts/examples.mjs"
            - "scripts/packages.mjs"
            - "package-lock.json"
            - ".github/workflows/examples.yml"
    pull_request:
        paths: *tested
    schedule:
        - cron: "0 7 * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: examples-${{ github.ref }}
    cancel-in-progress: true

jobs:
    list:
        runs-on: ubuntu-latest
        outputs:
            examples: ${{ steps.list.outputs.examples }}
        steps:
            - uses: actions/checkout@v7
            - id: list
              run: echo "examples=$(ls -d examples/*/ | xargs -n1 basename | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

    example:
        needs: list
        name: ${{ matrix.example }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                example: ${{ fromJSON(needs.list.outputs.examples) }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            # What an example installs, each built on the one before.
            - run: |
                  npm run build -w @docmentis/udoc-ui
                  npm run build -w @docmentis/udoc-editor
                  npm run build -w @docmentis/udoc-viewer
            - run: npm run examples -- ${{ matrix.example }}
