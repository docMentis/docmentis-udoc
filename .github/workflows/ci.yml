# Check every push to main and every pull request as a release is checked
# before it is published, on the oldest Node the packages support.
#
# The packages build against @docmentis/udoc-wasm from npm: there is no engine
# checkout beside this one here, so a change that needs an engine not yet
# released fails here until it is, and `npm run update-engine` pins it.
name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm run typecheck
            - run: npm test
            - run: npm run lint
            - run: npm run format:check
            # The build regenerates committed source, which must be committed.
            - run: git diff --exit-code
